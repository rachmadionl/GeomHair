    "blob_faces_idx": "DATA_ROOT/CASE_NAME/000/blob_face_indices.npy",
}
      
textured_strands: {
      "num_strands": 1900,
      "max_num_strands": 100000,
      "texture_size": 256,
      "geometry_descriptor_size": 64,
      "appearance_descriptor_size": 16,
      "path_to_mesh": "DATA_ROOT/CASE_NAME/000/registration_scaled.ply",
      "decoder_checkpoint_path": "./pretrained_models/strand_prior/strand_ckpt.pth",
      "cut_scalp": "DATA_ROOT/CASE_NAME/000/cut_scalp_verts.pickle",
  }

diffusion_prior: {
      "use_diffusion": true,
      "start_denoise": 1,
      "diffuse_mask": "DATA_ROOT/CASE_NAME/000/dif_mask.png",
      "diffuse_bs": 32,
      "diffuse_iter": 10000,
      "n_diffuse_steps": 2,
      "cfg_scale": 4.0,
      "precompute_condition": "DATA_ROOT/CASE_NAME/000/dataset/features/00000",
